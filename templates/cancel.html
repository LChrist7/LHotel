{% extends "base.html" %}

{% block title %}Отмена брони - LHotel{% endblock %}

{% block page_title %}Отмена бронирования{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px;">
    <div class="card-header">
        <h3 class="card-title">Отменить бронирование</h3>
    </div>
    <div class="card-body">
        <div class="alert alert-warning mb-5">
            <strong>Внимание!</strong> Отмена бронирования необратима. Убедитесь, что вводите правильный номер брони.
        </div>
        <form action="/cancel" method="post">
            <div class="form-group">
                <label class="form-label">Номер брони для отмены</label>
                <input type="text" name="numcancel" id="numcancel" placeholder="Введите номер брони..." required>
            </div>
            <button type="submit" class="btn btn-danger btn-block btn-lg" onclick="return confirm('Вы уверены, что хотите отменить эту бронь?')">
                Отменить бронирование
            </button>
        </form>
    </div>
</div>
{% endblock %}
